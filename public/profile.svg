<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#02040b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#57f4ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8a7dff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff4fd8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#c4956a"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0d1a30"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a0e"/>
      <stop offset="100%" stop-color="#1a0f08"/>
    </linearGradient>
    <radialGradient id="rimLight" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#57f4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="190"/>
    </clipPath>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bg)" stroke="rgba(87,244,255,0.2)" stroke-width="1"/>
  
  <!-- Glow overlay -->
  <circle cx="200" cy="200" r="190" fill="url(#glow)" clip-path="url(#circleClip)"/>
  
  <g clip-path="url(#circleClip)">
    <!-- Body / Shirt -->
    <ellipse cx="200" cy="420" rx="120" ry="100" fill="url(#shirt)"/>
    <!-- Shirt collar -->
    <path d="M160 330 L200 360 L240 330" fill="none" stroke="rgba(87,244,255,0.15)" stroke-width="1.5"/>
    
    <!-- Neck -->
    <rect x="182" y="270" width="36" height="50" rx="8" fill="url(#skin)"/>
    
    <!-- Head -->
    <ellipse cx="200" cy="220" rx="65" ry="75" fill="url(#skin)"/>
    
    <!-- Rim light on face -->
    <ellipse cx="200" cy="220" rx="65" ry="75" fill="url(#rimLight)"/>
    
    <!-- Hair -->
    <path d="M135 200 Q135 130 200 125 Q265 130 265 200 Q265 170 250 155 Q200 135 150 155 Q135 170 135 200Z" fill="url(#hair)"/>
    <!-- Hair side left -->
    <path d="M135 200 Q130 180 135 165 Q140 175 138 200Z" fill="url(#hair)"/>
    <!-- Hair side right -->
    <path d="M265 200 Q270 180 265 165 Q260 175 262 200Z" fill="url(#hair)"/>
    
    <!-- Eyes -->
    <ellipse cx="178" cy="225" rx="8" ry="5" fill="#1a0f08"/>
    <ellipse cx="222" cy="225" rx="8" ry="5" fill="#1a0f08"/>
    <!-- Eye highlights -->
    <circle cx="180" cy="223" r="2" fill="rgba(87,244,255,0.6)"/>
    <circle cx="224" cy="223" r="2" fill="rgba(87,244,255,0.6)"/>
    
    <!-- Eyebrows -->
    <path d="M166 215 Q178 210 190 214" fill="none" stroke="#1a0f08" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M210 214 Q222 210 234 215" fill="none" stroke="#1a0f08" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Nose -->
    <path d="M200 230 L196 248 Q200 252 204 248Z" fill="none" stroke="rgba(180,140,100,0.4)" stroke-width="1.5"/>
    
    <!-- Mouth -->
    <path d="M188 262 Q200 270 212 262" fill="none" stroke="rgba(180,120,100,0.5)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Cyber lines on face -->
    <line x1="135" y1="220" x2="145" y2="220" stroke="rgba(87,244,255,0.25)" stroke-width="0.8"/>
    <line x1="135" y1="225" x2="142" y2="225" stroke="rgba(87,244,255,0.2)" stroke-width="0.6"/>
    <line x1="255" y1="220" x2="265" y2="220" stroke="rgba(138,125,255,0.25)" stroke-width="0.8"/>
    <line x1="258" y1="225" x2="265" y2="225" stroke="rgba(138,125,255,0.2)" stroke-width="0.6"/>
  </g>
  
  <!-- Outer ring glow -->
  <circle cx="200" cy="200" r="193" fill="none" stroke="rgba(87,244,255,0.08)" stroke-width="2"/>
  <circle cx="200" cy="200" r="197" fill="none" stroke="rgba(138,125,255,0.05)" stroke-width="1"/>
</svg>
